# Local Postgres 16 with the production schema and row-level security policy.
# The app connects as calc_app (not the table owner), so the policy applies.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: calc
      POSTGRES_USER: calc_owner
      POSTGRES_PASSWORD: calc_owner
    ports:
      - "5433:5432"
    volumes:
      - ./calc-app/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calc_owner -d calc"]
      interval: 2s
      timeout: 2s
      retries: 15
